name: carelens
description: "CareLens - Ứng dụng chăm sóc sức khỏe thông minh cho người cao tuổi."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.1

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Local Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.4

  # Camera & Image Picker
  camera: ^0.12.0+2
  image_picker: ^1.1.2

  # AI
  google_generative_ai: ^0.4.6

  # Notifications
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # Persistent Key-Value Storage
  shared_preferences: ^2.3.2

  # Utilities
  intl: ^0.20.3
  share_plus: ^13.3.0
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - .env

  # fonts:
