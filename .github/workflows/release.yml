name: CareLens Release Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    
    # Kết nối với Environment Carelens để sử dụng các biến Secrets
    environment: Carelens

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Inject đủ 5 Gemini Keys từ GitHub Secrets vào file .env trên máy chủ
      - name: Inject Environment Secrets into .env file
        run: |
          touch .env
          echo "GEMINI_KEY_1=${{ secrets.GEMINI_KEY_1 }}" >> .env
          echo "GEMINI_KEY_2=${{ secrets.GEMINI_KEY_2 }}" >> .env
          echo "GEMINI_KEY_3=${{ secrets.GEMINI_KEY_3 }}" >> .env
          echo "GEMINI_KEY_4=${{ secrets.GEMINI_KEY_4 }}" >> .env
          echo "GEMINI_KEY_5=${{ secrets.GEMINI_KEY_5 }}" >> .env

      - name: Clean & Get Dependencies
        run: |
          flutter clean
          flutter pub get

      # Khắc phục lỗi Namespace & compileSdk cho Isar trên GitHub Actions Runner
      - name: Fix Isar Namespace for AGP Compatibility
        run: |
          ISAR_GRADLE="$HOME/.pub-cache/hosted/pub.dev/isar_flutter_libs-3.1.0+1/android/build.gradle"
          if [ -f "$ISAR_GRADLE" ]; then
            sed -i 's/android {/android {\n    namespace "dev.isar.isar_flutter_libs"/' "$ISAR_GRADLE"
          fi

      - name: Build Android Release APKs
        run: |
          flutter build apk --release --split-per-abi

      # Lưu trữ APK Artifacts cho lượt Push thông thường (Không tạo Tag)
      - name: Upload APK Artifacts (Non-Tag Runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: carelens-release-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: warn

      # Tự động xuất bản GitHub Release khi tạo Push Tag (Ví dụ: v1.0.0)
      - name: Create GitHub Release (Tag Runs)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}